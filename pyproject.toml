[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dagcraft"
version = "0.1.0"
description = "Config-driven DAG pipelines for Python."
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "pandas>=2.2",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "pyarrow>=16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.7",
]

[project.scripts]
dagcraft = "dagcraft.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

