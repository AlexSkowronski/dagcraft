[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dagcraft"
version = "0.1.0"
description = "Config-driven DAG pipelines for Python."
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "pandas>=3.0",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "pyarrow>=16.0",
    "fsspec>=2024.6.0",
]

[project.optional-dependencies]
excel = [
    "openpyxl>=3.1",
]
sql = [
    "sqlalchemy>=2.0",
]
azure = [
    "adlfs>=2024.7.0",
    "azure-identity>=1.15.0",
    "pyodbc>=5.0",
    "requests>=2.31",
    "sqlalchemy>=2.0",
]
all = [
    "dagcraft[azure,excel,sql]",
]

[project.scripts]
dagcraft = "dagcraft.cli:main"

[tool.setuptools.package-data]
dagcraft = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]
strict = true
filterwarnings = ["error"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "F",     # pyflakes
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "A",     # flake8-builtins
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
    "RET",   # flake8-return
    "PIE",   # flake8-pie
    "PT",    # flake8-pytest-style
    "PTH",   # flake8-use-pathlib
    "ARG",   # flake8-unused-arguments
    "BLE",   # flake8-blind-except
    "S",     # flake8-bandit
    "T20",   # flake8-print
    "G",     # flake8-logging-format
    "LOG",   # flake8-logging
    "TRY",   # tryceratops
    "TID",   # flake8-tidy-imports
    "ERA",   # eradicate (commented-out code)
    "PL",    # pylint
    "PERF",  # perflint
    "FURB",  # refurb
    "RUF",   # ruff-specific
]
ignore = [
    "TRY003",  # descriptive messages at the raise site are fine
    "ARG002",  # step methods share a fixed signature and may ignore arguments
]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = [
    "T201",  # scripts report progress with print
    "S311",  # seeded random numbers for sample data, not security
]
"tests/**" = [
    "S101",     # assert is how pytest works
    "PLR2004",  # literal values in assertions are fine
    "S105",     # fake credentials in tests are fine
    "S106",
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
mypy_path = "src"
files = ["src", "tests", "scripts"]
plugins = ["pydantic.mypy"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
enable_error_code = ["ignore-without-code"]

[[tool.mypy.overrides]]
# These ship without type information.
module = ["adlfs", "adlfs.*", "fsspec", "fsspec.*", "pyodbc"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "adlfs>=2026.8.0",
    "mypy>=2.4.0",
    "openpyxl>=3.1.5",
    "pandas-stubs>=3.0.5.260914",
    "pre-commit>=4.6.2",
    "pyodbc>=5.3.0",
    "pytest>=9.1.1",
    "responses>=0.26.3",
    "ruff>=0.16.10",
    "sqlalchemy>=2.1.2",
    "types-pyyaml>=6.0.12.20260906",
    "types-requests>=2.33.0.20260906",
]
