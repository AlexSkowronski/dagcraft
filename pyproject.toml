[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dagcraft-pipelines"
version = "0.1.0"
description = "Config-driven DAG pipelines for Python."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "AlexSkowronski" }]
keywords = ["pipeline", "dag", "etl", "yaml", "pandas", "azure", "sharepoint"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

dependencies = [
    "pandas>=3.0",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "pyarrow>=16.0",
    "fsspec>=2024.6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
excel = [
    "openpyxl>=3.1",
]
sql = [
    "sqlalchemy>=2.0",
]
azure = [
    "adlfs>=2024.7.0",
    "azure-identity>=1.15.0",
    "pyodbc>=5.0",
    "requests>=2.31",
    "sqlalchemy>=2.0",
]
all = [
    "dagcraft-pipelines[azure,excel,sql]",
]

[project.urls]
Homepage = "https://github.com/AlexSkowronski/dagcraft"
Repository = "https://github.com/AlexSkowronski/dagcraft"
Issues = "https://github.com/AlexSkowronski/dagcraft/issues"
Changelog = "https://github.com/AlexSkowronski/dagcraft/blob/main/CHANGELOG.md"

[project.scripts]
dagcraft = "dagcraft.cli:main"

[tool.setuptools.package-data]
dagcraft = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]
strict = true
filterwarnings = ["error"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "F",     # pyflakes
    "D",     # pydocstyle (docstrings)
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "A",     # flake8-builtins
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
    "RET",   # flake8-return
    "PIE",   # flake8-pie
    "PT",    # flake8-pytest-style
    "PTH",   # flake8-use-pathlib
    "ARG",   # flake8-unused-arguments
    "BLE",   # flake8-blind-except
    "S",     # flake8-bandit
    "T20",   # flake8-print
    "G",     # flake8-logging-format
    "LOG",   # flake8-logging
    "TRY",   # tryceratops
    "TID",   # flake8-tidy-imports
    "ERA",   # eradicate (commented-out code)
    "PL",    # pylint
    "PERF",  # perflint
    "FURB",  # refurb
    "RUF",   # ruff-specific
]
ignore = [
    "TRY003",  # descriptive messages at the raise site are fine
    "ARG002",  # step methods share a fixed signature and may ignore arguments
    "D102",    # overriding methods inherit the base class's docstring
    "D105",    # magic methods are self-explanatory
    "D107",    # __init__ arguments are described in the class docstring
    "D200",    # docstrings always open and close on their own lines...
    "D212",    # ...with the summary on the line after the opening quotes
]
# The other half of that docstring style: summary on the second line.
extend-select = ["D213"]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = [
    "T201",  # scripts report progress with print
    "S311",  # seeded random numbers for sample data, not security
]
"tests/**" = [
    "D",        # test names say what they check
    "S101",     # assert is how pytest works
    "PLR2004",  # literal values in assertions are fine
    "S105",     # fake credentials in tests are fine
    "S106",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
# Long signatures are fine when the extra arguments are keyword-only
# (PLR0917 still limits positional arguments to 5).
max-args = 8

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.pyright]
# The same checker VS Code's Pylance uses, so the editor and the hooks agree.
include = ["src", "tests", "scripts"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
# Pylance strikes deprecated calls through; fail on them here too.
reportDeprecated = "error"

[dependency-groups]
dev = [
    "adlfs>=2026.8.0",
    "openpyxl>=3.1.5",
    "pandas-stubs>=3.0.5.260914",
    "pre-commit>=4.6.2",
    "pyodbc>=5.3.0",
    "pyright[nodejs]>=1.1.400",
    "pytest>=9.1.1",
    "responses>=0.26.3",
    "ruff>=0.16.10",
    "sqlalchemy>=2.1.2",
    "types-pyyaml>=6.0.12.20260906",
    "types-requests>=2.33.0.20260906",
]
