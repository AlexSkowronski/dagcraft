# The smallest useful pipeline: read a CSV, drop incomplete rows, write it out.
#
#   dagcraft config/examples/basic.yaml

pipeline:
  name: basic

params:
  data_dir: data/sample
  output_dir: output

connections:
  data:
    type: local
    root: ${params.data_dir}
  output:
    type: local
    root: ${params.output_dir}

steps:
  - id: employees
    type: read
    connection: data
    path: employees.csv

  - id: salaried
    type: transform
    inputs:
      data: employees
    operations:
      - drop_nulls: [salary]

  - id: save
    type: write
    connection: output
    path: basic/salaried.csv
    inputs:
      data: salaried
