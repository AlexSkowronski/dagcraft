# Template: read a multi-sheet budget workbook from SharePoint, compare it
# with actuals from Azure SQL, and publish a workbook back to SharePoint.
# Replace the site, server and database with your own; needs
# `pip install 'dagcraft-pipelines[azure,excel]'` and an identity with Microsoft Graph
# access to the site's files.
#
#   dagcraft config/examples/sharepoint_reports.yaml --dry-run

pipeline:
  name: sharepoint_reports

params:
  year: 2026

connections:
  finance:
    type: sharepoint
    site: contoso.sharepoint.com/sites/Finance
    library: Documents
    folder: Reports/${params.year}
  warehouse:
    type: azure_sql
    server: myserver.database.windows.net
    database: analytics

steps:
  - id: budget
    type: read
    connection: finance
    path: Budget ${params.year}.xlsx
    args:
      sheet_name: [Q1, Q2, Q3, Q4]
      sheet_column: quarter

  - id: actuals
    type: read
    connection: warehouse
    query_file: config/examples/sql/actuals_by_department.sql
    params:
      year: ${params.year}

  - id: comparison
    type: transform
    inputs:
      data: budget
      actuals: actuals
    operations:
      - join: {right: actuals, on: [department, quarter], how: left}

  - id: publish
    type: write
    connection: finance
    path: Budget vs actuals ${params.year}.xlsx
    inputs:
      Comparison: comparison
      Budget: budget
