# Template: ingest a day of JSON files from Azure Blob Storage into Azure SQL.
# Replace the account, container, server and database with your own; needs
# `pip install 'dagcraft-pipelines[azure]'`, the ODBC driver, and `az login` (or a
# managed identity / service principal).
#
#   dagcraft config/examples/azure_blob_to_sql.yaml --dry-run
#   dagcraft config/examples/azure_blob_to_sql.yaml --check-connections
#   dagcraft config/examples/azure_blob_to_sql.yaml
#
# Set the RUN_DATE environment variable to load a different day.

pipeline:
  name: azure_blob_to_sql
  # Load environment variables, such as a connection string, from a .env
  # file next to this one. Variables already set in the environment win.
  # env_file: .env

params:
  # The RUN_DATE environment variable, or this default.
  run_date: ${env:RUN_DATE:-2026-10-02}

connections:
  lake:
    type: azure_blob
    account: mystorageaccount     # sign in as your `az login`, or...
    # connection_string: ${env:LAKE_CONNECTION_STRING}   # ...with a key
    container: raw
    prefix: events
  warehouse:
    type: azure_sql
    server: myserver.database.windows.net
    database: analytics

steps:
  - id: events
    type: read
    connection: lake
    path: ${params.run_date}/*.json
    source_column: source_file
    args:
      record_path: events
      meta: [batch_id]

  - id: purchases
    type: transform
    operation: filter
    inputs:
      data: events
    args:
      expression: type == 'purchase'

  - id: tidy
    type: transform
    operation: rename
    inputs:
      data: purchases
    args:
      columns:
        user.id: user_id
        properties.product_id: product_id

  - id: load
    type: write
    connection: warehouse
    table: staging.purchases
    if_exists: append
    inputs:
      data: tidy
