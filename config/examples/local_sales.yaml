# Join CSV and Parquet files, filter, reshape and write the result twice.
#
#   dagcraft config/examples/local_sales.yaml

pipeline:
  name: local_sales

params:
  data_dir: data/sample
  output_dir: output
  min_quantity: 2

connections:
  data:
    type: local
    root: ${params.data_dir}
  output:
    type: local
    root: ${params.output_dir}

steps:
  - id: customers
    type: read
    connection: data
    path: customers.csv

  - id: orders
    type: read
    connection: data
    path: orders.parquet

  # One step for the whole cleanup: each operation works on the last one's
  # result, and the check fails the run if the result looks wrong.
  - id: shipped_orders
    type: transform
    inputs:
      orders: orders
      customers: customers
    operations:
      - join: {left: orders, right: customers, on: customer_id, how: left}
      - filter: status == 'shipped' and quantity >= ${params.min_quantity}
      - select: [order_id, order_date, name, region, product_id, quantity, unit_price]
      - sort: [region, order_date]
      - check: {not_null: [order_id, region], unique: [order_id], min_rows: 1}

  - id: by_region
    type: transform
    inputs:
      data: shipped_orders
    operations:
      - aggregate:
          by: region
          columns:
            order_id: count
            quantity: sum

  - id: save_orders
    type: write
    connection: output
    path: local_sales/shipped_orders.parquet
    inputs:
      data: shipped_orders

  - id: save_summary
    type: write
    connection: output
    path: local_sales/orders_by_region.csv
    inputs:
      data: by_region
