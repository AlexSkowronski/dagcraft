name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --locked

      - name: Pre-commit hooks
        run: uv run --frozen pre-commit run --all-files --show-diff-on-failure

      - name: Build
        run: uv build

  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      # pyodbc needs the unixODBC library to be importable on Linux.
      - name: Install unixODBC
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y unixodbc

      - name: Install dependencies
        run: uv sync --locked

      - name: Tests
        run: uv run --frozen pytest
